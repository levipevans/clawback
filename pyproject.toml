[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawback"
version = "0.1.0"
description = "A small, security-first, local-first desktop assistant."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pillow>=10.3",
  "pydantic>=2.7",
  "pystray>=0.19.5",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
clawback = "clawback.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["clawback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
